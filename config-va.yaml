  # ============================================================================
  # File Service Mock Endpoints (minimal for VA - no image upload needed)
  # ============================================================================

  - id: "file_service_health_check"
    name: "File Service Health Check"
    path: "/file-service/health"
    config:
      status_code: 200
      content_type: "application/json"
      response_body: |
        {
          "success": true,
          "message": "File service is running",
          "service": "mock-file-service"
        }
      timeout: 10
      headers: {}
      enable_logging: false

  # ============================================================================
  # Health Check & Utility Endpoints
  # ============================================================================

  - id: "health_check"
    name: "Health Check"
    path: "/ping"
    config:
      status_code: 200
      content_type: "application/json"
      response_body: |
        {
          "message": "Payment Gateway Mock Server - VA is running!",
