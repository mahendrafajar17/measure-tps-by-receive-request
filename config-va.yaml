server:
  port: 8080
  host: "localhost"

logging:
  log_file: "payment-gateway-mock-va.log"
  log_level: "info"
  log_format: "text"

# Redis configuration for caching and session management
redis:
  host: "localhost"
  port: 6379
  password: ""
  database: 0
  max_retries: 3
  pool_size: 10
  connect_timeout: 5s

# Telegram alert configuration (optional - disable if not needed)
telegram:
  url: ""
  chat_id: ""
  product: "Payment Gateway Mock Server - VA"
  application: "webhook-server"
  retry:
    max_retry: 3
    interval: 5s
  alerts:
    high_tps_threshold: 1000
    error_rate_threshold: 5.0
    enable_performance_alerts: false
    enable_error_alerts: false

# Database configuration (disabled for mock server)
database:
  enabled: false
  host: "localhost"
  port: 5432
  username: "mock_user"
  password: "mock_pass"
  database: "mock_metrics"
  max_pool_size: 10
  connect_timeout: 5

# ==============================================================================
# VA (Virtual Account) TEST CASE - Payment Gateway Mock Endpoints
# ==============================================================================
default_webhooks:

