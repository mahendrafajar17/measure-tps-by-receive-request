  - id: "top_checkout_va_success"
    name: "TOP Checkout VA - Success"
    path: "/2.0/api/merchant/checkout"
    config:
      status_code: 200
      content_type: "application/json"
      response_body: |
        {
          "responseCode": "2000600",
          "responseMessage": "Success",
          "data": {
            "failure": false,
            "message": "Submit order Success",
            "redirectUrl": "https://api.toko-q.com",
            "method": "POST",
            "storeCode": "MNYTST01",
            "channelCode": "VABRIC",
            "sentEmailNewCustomer": false,
            "isGVA": true,
            "parameter": {
              "merchantId": "MNYTST01",
              "merchantTranId": "{{request.orderId}}",
              "currencyCode": "{{request.currency}}",
              "amount": "{{request.amount}}",
              "custName": "{{request.customerName}}",
              "custEmail": "{{request.customerEmail}}",
              "returnUrl": "{{request.returnUrl}}",
              "paymentId": "PAY1733800001UVW",
              "paymentMethod": "2",
              "transactionType": "1",
              "transactionId": "TXN1733800001DEF",
              "orderCreated": "{{request.orderCreated}}",
              "orderExpired": "{{request.orderExpired}}",
